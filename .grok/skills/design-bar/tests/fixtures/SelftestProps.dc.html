<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自测画板：属性和视口</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:hover,button:hover,[role="button"]:hover{opacity:.9}
a:active,button:active,[role="button"]:active{opacity:.8}
:root{--ground:#f4f2ec;--ink:#1c1d19}
[data-theme="dark"]{--ground:#121310;--ink:#ecebe4}
</style>
</helmet>
<div data-theme="light" style="box-sizing: border-box; width: 100%; min-height: 600px; padding: 24px 15px; background: var(--ground); color: var(--ink); font-family: sans-serif;">
<p style="font-size: 17px;">{{ title }}</p>
<div style="width: 360px; height: 48px; font-size: 15px;">在 390 宽下放得下，在 320 宽下超出</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang": {"editor": "enum", "options": ["中文", "English"], "default": "中文"}, "theme": {"editor": "enum", "options": ["浅色", "深色"], "default": "浅色"}}'>
class Component extends DCLogic { renderVals() { return { title: this.props.lang === 'English' ? 'Weekly letter: TBD' : '每周一封信' }; } }
</script>
</body>
</html>
